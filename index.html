<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Rail Rush Adventure</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

body{
    background:#111;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(#78d7ff,#dff8ff 55%,#65bd55);
}

/* SKY */
.sky{
    position:absolute;
    inset:0 0 45%;
    background:linear-gradient(#45bff5,#c9f3ff);
    z-index:0;
}

.cloud{
    position:absolute;
    width:120px;
    height:40px;
    background:white;
    border-radius:50px;
    opacity:.8;
    animation:cloudMove 25s linear infinite;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:white;
    border-radius:50%;
}

.cloud:before{
    width:55px;
    height:55px;
    left:20px;
    top:-25px;
}

.cloud:after{
    width:70px;
    height:70px;
    right:15px;
    top:-35px;
}

.c1{top:12%;left:5%}
.c2{top:22%;left:55%;animation-duration:32s}
.c3{top:8%;left:80%;animation-duration:28s}

@keyframes cloudMove{
    from{transform:translateX(-150px)}
    to{transform:translateX(120vw)}
}

/* BACKGROUND */
.mountain{
    position:absolute;
    bottom:40%;
    width:0;
    height:0;
    border-left:180px solid transparent;
    border-right:180px solid transparent;
    border-bottom:260px solid #6fa86d;
}

.m1{left:-100px}
.m2{left:230px;transform:scale(.8)}
.m3{right:-100px;transform:scale(1.1)}

.ground{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:42%;
    background:
      repeating-linear-gradient(
        90deg,
        #3c9a42 0 50px,
        #45a74b 50px 100px
      );
}

/* ROAD */
.road{
    position:absolute;
    left:50%;
    bottom:-10%;
    width:65%;
    height:80%;
    transform:translateX(-50%);
    background:#555;
    clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);
    z-index:2;
}

.rail{
    position:absolute;
    bottom:0;
    width:9px;
    height:100%;
    background:#ddd;
    z-index:3;
}

.rail.left{
    left:35%;
    transform:rotate(4deg);
}

.rail.right{
    right:35%;
    transform:rotate(-4deg);
}

.sleeper{
    position:absolute;
    left:25%;
    width:50%;
    height:13px;
    background:#70472c;
    z-index:3;
}

/* PLAYER */
#player{
    position:absolute;
    z-index:20;
    width:55px;
    height:75px;
    bottom:20%;
    left:50%;
    transform:translateX(-50%);
    transition:left .12s;
}

.player-body{
    position:absolute;
    width:42px;
    height:48px;
    bottom:0;
    left:7px;
    background:#1976d2;
    border-radius:14px 14px 8px 8px;
}

.player-head{
    position:absolute;
    width:35px;
    height:35px;
    background:#ffc49a;
    border-radius:50%;
    left:10px;
    top:0;
    border:3px solid #333;
}

.player-head:before,
.player-head:after{
    content:"";
    position:absolute;
    width:5px;
    height:5px;
    background:#222;
    border-radius:50%;
    top:12px;
}

.player-head:before{left:8px}
.player-head:after{right:8px}

.arm{
    position:absolute;
    width:10px;
    height:30px;
    background:#ffc49a;
    border-radius:10px;
    top:43px;
}

.arm.left{left:0;transform:rotate(20deg)}
.arm.right{right:0;transform:rotate(-20deg)}

.leg{
    position:absolute;
    width:11px;
    height:25px;
    background:#222;
    bottom:-18px;
}

.leg.left{left:13px}
.leg.right{right:13px}

/* ITEMS */
.item{
    position:absolute;
    z-index:15;
    font-size:35px;
    width:45px;
    height:45px;
    text-align:center;
}

.coin{
    filter:drop-shadow(0 0 5px gold);
}

.diamond{
    filter:drop-shadow(0 0 7px #00eaff);
}

.obstacle{
    position:absolute;
    width:55px;
    height:55px;
    background:#d32f2f;
    border:5px solid #8b0000;
    border-radius:8px;
    z-index:15;
}

/* HUD */
#hud{
    position:absolute;
    z-index:100;
    top:10px;
    left:10px;
    right:10px;
    display:flex;
    justify-content:space-between;
    gap:8px;
}

.hud-box{
    background:rgba(0,0,0,.65);
    color:white;
    padding:8px 12px;
    border-radius:15px;
    font-weight:bold;
    font-size:15px;
}

/* LEVEL */
#level{
    position:absolute;
    top:65px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    background:rgba(0,0,0,.65);
    color:#fff;
    padding:7px 18px;
    border-radius:20px;
    font-weight:bold;
}

/* START SCREEN */
.screen{
    position:absolute;
    inset:0;
    z-index:500;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(0,0,0,.78);
    color:white;
    text-align:center;
}

.screen h1{
    font-size:42px;
    color:#ffd600;
    text-shadow:3px 3px #8b4500;
    margin-bottom:10px;
}

.screen p{
    margin:7px;
}

button{
    margin-top:20px;
    padding:14px 35px;
    border:none;
    border-radius:30px;
    background:#ffca28;
    color:#222;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.95);
}

/* CONTROLS */
#controls{
    position:absolute;
    bottom:20px;
    left:0;
    right:0;
    z-index:200;
    display:flex;
    justify-content:center;
    gap:15px;
}

.control{
    width:65px;
    height:65px;
    border-radius:50%;
    border:3px solid white;
    background:rgba(0,0,0,.5);
    color:white;
    font-size:28px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.control.jump{
    width:80px;
    height:80px;
    background:rgba(255,193,7,.75);
}

/* JUMP */
.jumping{
    animation:jump .65s ease;
}

@keyframes jump{
    0%{bottom:20%}
    45%{bottom:43%}
    100%{bottom:20%}
}

/* MOBILE */
@media(max-width:600px){
    .road{
        width:100%;
    }

    #player{
        bottom:23%;
    }

    .screen h1{
        font-size:32px;
    }

    .hud-box{
        font-size:12px;
        padding:7px 8px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div class="sky"></div>

    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <div class="mountain m1"></div>
    <div class="mountain m2"></div>
    <div class="mountain m3"></div>

    <div class="ground"></div>

    <div class="road"></div>

    <div class="rail left"></div>
    <div class="rail right"></div>

    <div id="hud">
        <div class="hud-box">🏆 <span id="score">0</span></div>
        <div class="hud-box">🪙 <span id="coins">0</span></div>
        <div class="hud-box">💎 <span id="diamonds">0</span></div>
        <div class="hud-box">❤️ <span id="lives">3</span></div>
    </div>

    <div id="level">
        LEVEL 1 - KOTA
    </div>

    <div id="player">

        <div class="player-head"></div>
        <div class="player-body"></div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="leg left"></div>
        <div class="leg right"></div>

    </div>

    <div id="controls">

        <div class="control" id="leftBtn">⬅️</div>

        <div class="control jump" id="jumpBtn">⬆️</div>

        <div class="control" id="rightBtn">➡️</div>

    </div>

    <div class="screen" id="startScreen">

        <h1>🚂 RAIL RUSH</h1>

        <p>ADVENTURE</p>

        <p>🪙 Kumpulkan Coin</p>
        <p>💎 Cari Diamond</p>
        <p>🚧 Hindari Rintangan</p>
        <p>❤️ Jangan sampai kehabisan nyawa!</p>

        <button id="startBtn">
            MULAI GAME
        </button>

    </div>

    <div class="screen" id="gameOver" style="display:none">

        <h1>GAME OVER</h1>

        <p>Skor kamu:</p>

        <h2 id="finalScore">0</h2>

        <button id="restartBtn">
            MAIN LAGI
        </button>

    </div>

</div>

<script>

/* =========================
   GAME VARIABLES
========================= */

let gameRunning = false;

let score = 0;
let coins = 0;
let diamonds = 0;
let lives = 3;

let playerLane = 1;

let speed = 5;

let level = 1;

let spawnTimer = 0;

let objects = [];

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const scoreEl =
    document.getElementById("score");

const coinsEl =
    document.getElementById("coins");

const diamondsEl =
    document.getElementById("diamonds");

const livesEl =
    document.getElementById("lives");

const levelEl =
    document.getElementById("level");

const startScreen =
    document.getElementById("startScreen");

const gameOverScreen =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");


/* =========================
   LANES
========================= */

function getLanePosition(lane){

    const width =
        game.clientWidth;

    if(width < 600){

        const positions =
        [
            "31%",
            "50%",
            "69%"
        ];

        return positions[lane];

    }else{

        const positions =
        [
            "38%",
            "50%",
            "62%"
        ];

        return positions[lane];
    }
}


/* =========================
   PLAYER
========================= */

function updatePlayer(){

    player.style.left =
        getLanePosition(playerLane);

}


/* =========================
   MOVE LEFT
========================= */

function moveLeft(){

    if(!gameRunning) return;

    if(playerLane > 0){

        playerLane--;

        updatePlayer();
    }
}


/* =========================
   MOVE RIGHT
========================= */

function moveRight(){

    if(!gameRunning) return;

    if(playerLane < 2){

        playerLane++;

        updatePlayer();
    }
}


/* =========================
   JUMP
========================= */

function jump(){

    if(!gameRunning) return;

    if(player.classList.contains("jumping"))
        return;

    player.classList.add("jumping");

    setTimeout(()=>{

        player.classList.remove("jumping");

    },650);
}


/* =========================
   CREATE COIN
========================= */

function createCoin(){

    const coin =
        document.createElement("div");

    coin.className =
        "item coin";

    coin.innerHTML = "🪙";

    const lane =
        Math.floor(Math.random()*3);

    coin.dataset.lane = lane;

    coin.style.left =
        getLanePosition(lane);

    coin.style.top =
        "-60px";

    game.appendChild(coin);

    objects.push({
        el:coin,
        type:"coin",
        y:-60,
        lane:lane
    });
}


/* =========================
   CREATE DIAMOND
========================= */

function createDiamond(){

    const diamond =
        document.createElement("div");

    diamond.className =
        "item diamond";

    diamond.innerHTML = "💎";

    const lane =
        Math.floor(Math.random()*3);

    diamond.dataset.lane = lane;

    diamond.style.left =
        getLanePosition(lane);

    diamond.style.top =
        "-60px";

    game.appendChild(diamond);

    objects.push({
        el:diamond,
        type:"diamond",
        y:-60,
        lane:lane
    });
}


/* =========================
   CREATE OBSTACLE
========================= */

function createObstacle(){

    const obstacle =
        document.createElement("div");

    obstacle.className =
        "obstacle";

    const lane =
        Math.floor(Math.random()*3);

    obstacle.dataset.lane = lane;

    obstacle.style.left =
        getLanePosition(lane);

    obstacle.style.top =
        "-70px";

    game.appendChild(obstacle);

    objects.push({
        el:obstacle,
        type:"obstacle",
        y:-70,
        lane:lane
    });
}


/* =========================
   COLLISION
========================= */

function collision(obj){

    if(obj.lane !== playerLane)
        return false;

    const playerRect =
        player.getBoundingClientRect();

    const objectRect =
        obj.el.getBoundingClientRect();

    return !(
        playerRect.right < objectRect.left ||
        playerRect.left > objectRect.right ||
        playerRect.bottom < objectRect.top ||
        playerRect.top > objectRect.bottom
    );
}


/* =========================
   HIT OBSTACLE
========================= */

function hitObstacle(obj){

    lives--;

    livesEl.textContent =
        lives;

    obj.el.remove();

    if(lives <= 0){

        endGame();

    }
}


/* =========================
   COLLECT ITEM
========================= */

function collect(obj){

    if(obj.type === "coin"){

        coins++;

        score += 10;

        coinsEl.textContent =
            coins;
    }

    if(obj.type === "diamond"){

        diamonds++;

        score += 50;

        diamondsEl.textContent =
            diamonds;
    }

    scoreEl.textContent =
        score;

    obj.el.remove();
}


/* =========================
   LEVEL SYSTEM
========================= */

function checkLevel(){

    const newLevel =
        Math.floor(score / 300) + 1;

    if(newLevel !== level){

        level = newLevel;

        speed =
            5 + (level-1)*0.8;

        if(level === 2){

            levelEl.textContent =
                "LEVEL 2 - GOA";

        }else if(level === 3){

            levelEl.textContent =
                "LEVEL 3 - DESA";

        }else{

            levelEl.textContent =
                "LEVEL " +
                level +
                " - PETUALANGAN";
        }
    }
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

    if(!gameRunning)
        return;

    score++;

    scoreEl.textContent =
        score;

    checkLevel();

    spawnTimer--;

    if(spawnTimer <= 0){

        const random =
            Math.random();

        if(random < .55){

            createCoin();

        }else if(random < .72){

            createDiamond();

        }else{

            createObstacle();
        }

        spawnTimer =
            Math.max(
                20,
                55 - level*3
            );
    }


    /* MOVE OBJECTS */

    objects.forEach((obj,index)=>{

        obj.y += speed;

        obj.el.style.top =
            obj.y + "px";


        /* COLLISION */

        if(collision(obj)){

            if(obj.type === "obstacle"){

                hitObstacle(obj);

                objects.splice(index,1);

                return;

            }else{

                collect(obj);

                objects.splice(index,1);

                return;
            }
        }


        /* REMOVE */

        if(obj.y >
            game.clientHeight + 100){

            obj.el.remove();

            objects.splice(index,1);
        }

    });


    requestAnimationFrame(gameLoop);
}


/* =========================
   START GAME
========================= */

function startGame(){

    score = 0;
    coins = 0;
    diamonds = 0;
    lives = 3;

    level = 1;

    speed = 5;

    playerLane = 1;

    spawnTimer = 20;

    objects.forEach(obj=>{
        obj.el.remove();
    });

    objects = [];

    scoreEl.textContent = "0";
    coinsEl.textContent = "0";
    diamondsEl.textContent = "0";
    livesEl.textContent = "3";

    levelEl.textContent =
        "LEVEL 1 - KOTA";

    updatePlayer();

    startScreen.style.display =
        "none";

    gameOverScreen.style.display =
        "none";

    gameRunning = true;

    requestAnimationFrame(gameLoop);
}


/* =========================
   GAME OVER
========================= */

function endGame(){

    gameRunning = false;

    finalScore.textContent =
        score;

    gameOverScreen.style.display =
        "flex";
}


/* =========================
   BUTTONS
========================= */

document
    .getElementById("startBtn")
    .addEventListener(
        "click",
        startGame
    );

document
    .getElementById("restartBtn")
    .addEventListener(
        "click",
        startGame
    );

document
    .getElementById("leftBtn")
    .addEventListener(
        "pointerdown",
        moveLeft
    );

document
    .getElementById("rightBtn")
    .addEventListener(
        "pointerdown",
        moveRight
    );

document
    .getElementById("jumpBtn")
    .addEventListener(
        "pointerdown",
        jump
    );


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "ArrowLeft" ||
           e.key.toLowerCase() === "a"){

            moveLeft();

        }

        if(e.key === "ArrowRight" ||
           e.key.toLowerCase() === "d"){

            moveRight();

        }

        if(e.key === "ArrowUp" ||
           e.key === " " ||
           e.key.toLowerCase() === "w"){

            jump();
        }

        if(e.key === "Enter" &&
           !gameRunning){

            startGame();
        }
    }
);


/* =========================
   SWIPE CONTROL
========================= */

let touchStartX = 0;
let touchStartY = 0;

game.addEventListener(
    "touchstart",
    function(e){

        touchStartX =
            e.changedTouches[0].screenX;

        touchStartY =
            e.changedTouches[0].screenY;

    },
    {passive:false}
);


game.addEventListener(
    "touchend",
    function(e){

        if(!gameRunning)
            return;

        const x =
            e.changedTouches[0].screenX;

        const y =
            e.changedTouches[0].screenY;

        const dx =
            x - touchStartX;

        const dy =
            y - touchStartY;


        if(Math.abs(dx) >
           Math.abs(dy)){

            if(dx > 40){

                moveRight();

            }else if(dx < -40){

                moveLeft();
            }

        }else{

            if(dy < -40){

                jump();
            }
        }

    },
    {passive:false}
);


/* =========================
   INITIAL POSITION
========================= */

updatePlayer();

</script>

</body>
</html>
