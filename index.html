<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rail Rush Adventure</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050713;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  max-width:650px;
  margin:auto;
  overflow:hidden;
  background:#10152b;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}

#hud{
  position:absolute;
  top:13px;
  left:13px;
  right:13px;
  z-index:20;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.box{
  padding:8px 12px;
  border-radius:15px;
  color:white;
  font-weight:bold;
  background:rgba(5,10,30,.66);
  border:1px solid rgba(150,195,255,.55);
  backdrop-filter:blur(8px);
  box-shadow:0 5px 25px rgba(0,0,0,.25);
}

.sub{
  margin-top:5px;
  font-size:12px;
}

#area{
  position:absolute;
  top:85px;
  left:50%;
  transform:translateX(-50%);
  z-index:22;
  padding:8px 17px;
  border-radius:20px;
  background:rgba(4,8,25,.55);
  border:1px solid rgba(150,190,255,.45);
  color:white;
  font-size:12px;
  opacity:0;
  transition:opacity .5s;
}

#flash{
  position:absolute;
  inset:0;
  z-index:19;
  background:white;
  pointer-events:none;
  opacity:0;
}

#pause{
  position:absolute;
  right:14px;
  top:66px;
  z-index:25;
  width:42px;
  height:42px;
  border-radius:50%;
  color:white;
  background:rgba(5,10,30,.7);
  border:1px solid #9bc5ff;
  font-size:18px;
}

#controls{
  position:absolute;
  bottom:18px;
  left:0;
  right:0;
  z-index:40;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 17px;
  pointer-events:none;
}

.ctrl{
  width:68px;
  height:68px;
  border-radius:50%;
  color:white;
  background:rgba(5,11,33,.75);
  border:2px solid rgba(185,220,255,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:bold;
  pointer-events:auto;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 7px 25px rgba(0,0,0,.35);
}

.ctrl:active{
  transform:scale(.86);
  background:rgba(75,105,220,.9);
}

.jump{
  width:92px;
  border-radius:35px;
  font-size:14px;
}

.screen{
  position:absolute;
  inset:0;
  z-index:60;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(3,6,20,.6);
  backdrop-filter:blur(5px);
}

.panel{
  width:88%;
  max-width:430px;
  padding:30px 22px;
  text-align:center;
  border-radius:30px;
  color:white;
  background:linear-gradient(145deg,#182759,#291344);
  border:1px solid rgba(155,190,255,.7);
  box-shadow:0 20px 70px rgba(0,0,0,.55);
}

.logo{
  font-size:39px;
  line-height:.9;
  font-weight:900;
  letter-spacing:-2px;
  background:linear-gradient(90deg,#5cecff,#8572ff,#f15bff);
  -webkit-background-clip:text;
  color:transparent;
}

.desc{
  color:#c8d0ef;
  font-size:13px;
  margin:15px 0 20px;
}

.btn{
  border:0;
  color:white;
  font-size:17px;
  font-weight:bold;
  padding:14px 38px;
  border-radius:30px;
  background:linear-gradient(90deg,#536dff,#c83cff);
  box-shadow:0 8px 30px rgba(112,65,255,.45);
}

.btn:active{
  transform:scale(.95);
}

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:20px 0;
}

.feature{
  padding:10px 3px;
  border-radius:13px;
  background:rgba(255,255,255,.06);
  font-size:11px;
  color:#dfe5ff;
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">
  <div>
    <div class="box">🏆 <span id="score">0</span></div>
    <div class="box sub">
      🪙 <span id="coins">0</span>
      &nbsp;&nbsp;
      💎 <span id="gems">0</span>
    </div>
  </div>

  <div class="box">❤️ <span id="life">3</span></div>
</div>

<div id="area"></div>
<div id="flash"></div>

<button id="pause">Ⅱ</button>

<div id="controls">
  <button class="ctrl" id="leftBtn">◀</button>
  <button class="ctrl jump" id="jumpBtn">JUMP</button>
  <button class="ctrl" id="rightBtn">▶</button>
</div>

<!-- START -->
<div id="start" class="screen">
  <div class="panel">

    <div class="logo">
      RAIL<br>ADVENTURE
    </div>

    <div class="desc">
      Jelajahi kota, lewati goa, dan terus berlari
      sampai ke desa!
    </div>

    <div class="features">
      <div class="feature">🌆<br>KOTA</div>
      <div class="feature">🕳️<br>GOA</div>
      <div class="feature">🏡<br>DESA</div>
    </div>

    <button class="btn" id="startBtn">
      MULAI GAME
    </button>

    <p style="font-size:11px;color:#aab4d8;margin-top:17px">
      Swipe kiri/kanan • Swipe atas untuk lompat
    </p>

  </div>
</div>

<!-- GAME OVER -->
<div id="over" class="screen hidden">
  <div class="panel">

    <div style="font-size:30px;font-weight:900">
      GAME OVER
    </div>

    <p style="color:#aeb8dc;margin:12px">
      Skor kamu
    </p>

    <div id="finalScore"
         style="font-size:50px;font-weight:900;color:#ffd957">
      0
    </div>

    <p style="margin:9px;color:#b8c1e4">
      🏆 Best Score: <span id="best">0</span>
    </p>

    <button class="btn" id="again">
      MAIN LAGI
    </button>

  </div>
</div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0;
let H=0;
let DPR=1;

function resize(){

  W=innerWidth;
  H=innerHeight;

  DPR=Math.min(devicePixelRatio||1,2);

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

/* =========================
   GAME DATA
========================= */

const game={

  running:false,
  paused:false,

  lane:1,
  targetLane:1,

  score:0,
  coins:0,
  gems:0,
  life:3,

  distance:0,

  speed:.009,

  objects:[],
  particles:[],

  area:0,

  best:Number(
    localStorage.getItem("railAdventureBest")||0
  )
};

const player={
  jump:0,
  velocity:0,
  run:0,
  hit:0
};


/*
  SATU DUNIA BESAR

  0 - 600  : KOTA
  600-1200 : GOA
  1200-1800: DESA

  Setelah 1800:
  ulang lagi dengan transisi baru.
*/

function worldDistance(){

  return game.distance%1800;
}

function getArea(){

  const d=worldDistance();

  if(d<520)
    return 0;

  if(d<1120)
    return 1;

  return 2;
}


/* =========================
   UTIL
========================= */

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function rand(a,b){
  return a+Math.random()*(b-a);
}

function laneX(lane,z){

  const spread=W*(.06+.20*z);

  return W/2+(lane-1)*spread;
}

function perspective(z){

  const horizon=H*.37;
  const bottom=H*.98;

  return horizon+(bottom-horizon)*z;
}


/* =========================
   SKY
========================= */

function drawSky(){

  const area=getArea();

  let g;

  if(area===0){

    g=ctx.createLinearGradient(
      0,0,0,H
    );

    g.addColorStop(0,"#07143d");
    g.addColorStop(.45,"#17255c");
    g.addColorStop(1,"#40214c");

  }else if(area===1){

    g=ctx.createLinearGradient(
      0,0,0,H
    );

    g.addColorStop(0,"#071018");
    g.addColorStop(.5,"#142331");
    g.addColorStop(1,"#090d14");

  }else{

    g=ctx.createLinearGradient(
      0,0,0,H
    );

    g.addColorStop(0,"#75cfff");
    g.addColorStop(.5,"#b9e8ff");
    g.addColorStop(1,"#5a9b69");
  }

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);


  /* matahari / bulan */

  if(area!==1){

    ctx.beginPath();

    ctx.arc(
      area===0?W*.82:W*.78,
      area===0?H*.13:H*.16,
      area===0?34:43,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      area===0?"#fff3bd":"#fff2a0";

    ctx.shadowBlur=35;
    ctx.shadowColor="#fff1a0";

    ctx.fill();

    ctx.shadowBlur=0;
  }


  /* awan */

  if(area===0||area===2){

    for(let i=0;i<5;i++){

      let x=
        ((i*190-game.distance*.025)
        %(W+260))-120;

      let y=H*.18+(i%2)*40;

      ctx.fillStyle=
        area===2?
        "rgba(255,255,255,.45)":
        "rgba(140,170,220,.15)";

      ctx.beginPath();

      ctx.arc(x,y,23,0,Math.PI*2);
      ctx.arc(x+28,y-9,31,0,Math.PI*2);
      ctx.arc(x+60,y,24,0,Math.PI*2);

      ctx.fill();
    }
  }


  /* bintang */

  if(area===0){

    for(let i=0;i<35;i++){

      const x=(i*97)%W;
      const y=(i*41)%(H*.32);

      ctx.fillStyle=
        "rgba(255,255,255,.5)";

      ctx.fillRect(x,y,1.5,1.5);
    }
  }
}


/* =========================
   CITY
========================= */

function city(){

  const horizon=H*.38;

  for(let i=-2;i<15;i++){

    const x=
      i*58-
      (game.distance*.018%58);

    const h=
      45+(Math.abs(i*43)%125);

    ctx.fillStyle=
      i%2?
      "#111b3a":
      "#182344";

    ctx.fillRect(
      x,
      horizon-h,
      53,
      h
    );

    for(let yy=0;yy<4;yy++){

      for(let xx=0;xx<3;xx++){

        if((i+xx+yy)%3===0){

          ctx.fillStyle=
            "#64d7ff";

          ctx.globalAlpha=.5;

          ctx.fillRect(
            x+8+xx*15,
            horizon-h+13+yy*22,
            5,
            7
          );

          ctx.globalAlpha=1;
        }
      }
    }
  }
}


/* =========================
   VILLAGE
========================= */

function house(x,y,s){

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s,s);

  /* shadow */

  ctx.fillStyle=
    "rgba(0,0,0,.25)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    5,
    42,
    10,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* rumah */

  const wall=
    ctx.createLinearGradient(
      -35,-75,
      35,0
    );

  wall.addColorStop(0,"#f3d0a1");
  wall.addColorStop(1,"#b77a59");

  ctx.fillStyle=wall;

  ctx.fillRect(
    -35,-72,
    70,72
  );


  /* atap */

  ctx.beginPath();

  ctx.moveTo(-48,-70);
  ctx.lineTo(0,-112);
  ctx.lineTo(48,-70);

  ctx.closePath();

  const roof=
    ctx.createLinearGradient(
      0,-112,
      0,-65
    );

  roof.addColorStop(0,"#744455");
  roof.addColorStop(1,"#38243a");

  ctx.fillStyle=roof;
  ctx.fill();


  /* pintu */

  ctx.fillStyle="#503547";

  ctx.fillRect(
    -9,
    -43,
    18,
    43
  );


  /* jendela */

  ctx.fillStyle="#ffe27b";

  ctx.shadowBlur=12;
  ctx.shadowColor="#ffd65b";

  ctx.fillRect(
    15,
    -55,
    14,
    14
  );

  ctx.shadowBlur=0;

  ctx.restore();
}


/* =========================
   TREES
========================= */

function tree(x,y,s){

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s,s);

  ctx.fillStyle="#553326";

  ctx.fillRect(
    -5,-60,
    10,60
  );

  ctx.fillStyle="#286344";

  ctx.beginPath();

  ctx.arc(0,-76,26,0,Math.PI*2);
  ctx.arc(-18,-59,20,0,Math.PI*2);
  ctx.arc(18,-59,20,0,Math.PI*2);

  ctx.fill();

  ctx.fillStyle="#3d8a55";

  ctx.beginPath();

  ctx.arc(
    0,-91,
    19,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}


/* =========================
   GOA
========================= */

function cave(){

  const horizon=H*.37;

  /* mulut goa */

  ctx.fillStyle="rgba(2,5,10,.95)";

  ctx.beginPath();

  ctx.moveTo(0,0);
  ctx.lineTo(W,0);
  ctx.lineTo(W,horizon);

  ctx.quadraticCurveTo(
    W*.72,
    horizon-75,
    W*.5,
    horizon+8
  );

  ctx.quadraticCurveTo(
    W*.28,
    horizon-75,
    0,
    horizon
  );

  ctx.closePath();

  ctx.fill();


  /* dinding */

  ctx.fillStyle="#19212c";

  ctx.beginPath();

  ctx.moveTo(0,H);
  ctx.lineTo(0,horizon);

  ctx.quadraticCurveTo(
    W*.27,
    horizon-75,
    W*.5,
    horizon+8
  );

  ctx.lineTo(W*.5,H);

  ctx.closePath();

  ctx.fill();


  ctx.beginPath();

  ctx.moveTo(W,H);
  ctx.lineTo(W,horizon);

  ctx.quadraticCurveTo(
    W*.73,
    horizon-75,
    W*.5,
    horizon+8
  );

  ctx.lineTo(W*.5,H);

  ctx.closePath();

  ctx.fill();


  /* lampu */

  for(let i=0;i<8;i++){

    const z=
      (i/8+
      game.distance*.0018)%1;

    const y=perspective(z);

    const x=
      W/2+
      (i%2?-1:1)*
      roadWidth(z)*.42;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      4+6*z,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#67ddff";

    ctx.shadowBlur=20;
    ctx.shadowColor="#55ddff";

    ctx.fill();

    ctx.shadowBlur=0;
  }
}


/* =========================
   ROAD
========================= */

function roadWidth(z){

  return W*(.12+.88*z);
}

function rails(){

  const horizon=H*.37;
  const bottom=H;

  /* tanah */

  ctx.beginPath();

  ctx.moveTo(W*.38,horizon);
  ctx.lineTo(W*.62,horizon);
  ctx.lineTo(W*1.12,bottom);
  ctx.lineTo(-W*.12,bottom);

  ctx.closePath();

  const g=
    ctx.createLinearGradient(
      0,horizon,
      0,bottom
    );

  g.addColorStop(0,"#282d40");
  g.addColorStop(1,"#111521");

  ctx.fillStyle=g;
  ctx.fill();


  /* tiga jalur */

  for(let l=0;l<3;l++){

    const off=(l-1)*W*.045;

    ctx.beginPath();

    ctx.moveTo(
      W/2+off-7,
      horizon
    );

    ctx.lineTo(
      W/2+off-7,
      bottom
    );

    ctx.strokeStyle="#555d6e";
    ctx.lineWidth=5;

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
      W/2+off+7,
      horizon
    );

    ctx.lineTo(
      W/2+off+7,
      bottom
    );

    ctx.strokeStyle="#858b9a";
    ctx.lineWidth=3;

    ctx.stroke();
  }


  /* bantalan */

  for(let i=0;i<28;i++){

    const z=
      (i/28+
      game.distance*.004)%1;

    const y=perspective(z);
    const rw=roadWidth(z);

    ctx.strokeStyle=
      `rgba(116,93,75,${.3+.65*z})`;

    ctx.lineWidth=
      3+8*z;

    ctx.beginPath();

    ctx.moveTo(
      W/2-rw*.45,
      y
    );

    ctx.lineTo(
      W/2+rw*.45,
      y
    );

    ctx.stroke();
  }
}


/* =========================
   TRAIN
========================= */

function train(o){

  const z=o.z;

  const x=laneX(o.lane,z);

  const y=perspective(z);

  const s=.12+1.55*z;

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s,s);


  /* shadow */

  ctx.fillStyle=
    "rgba(0,0,0,.45)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    8,
    54,
    12,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* badan */

  const g=
    ctx.createLinearGradient(
      -45,-130,
      45,0
    );

  g.addColorStop(0,"#e25c68");
  g.addColorStop(.5,"#ad3048");
  g.addColorStop(1,"#641e35");

  ctx.fillStyle=g;

  ctx.fillRect(
    -44,
    -130,
    88,
    130
  );


  /* bagian depan */

  ctx.fillStyle="#301927";

  ctx.fillRect(
    -35,
    -105,
    70,
    57
  );


  /* kaca */

  ctx.fillStyle="#61bdd7";

  ctx.shadowBlur=14;
  ctx.shadowColor="#4bdcff";

  ctx.fillRect(
    -27,
    -95,
    54,
    30
  );

  ctx.shadowBlur=0;


  /* lampu */

  ctx.fillStyle="#fff2a4";

  ctx.shadowBlur=18;
  ctx.shadowColor="#fff0a0";

  ctx.beginPath();

  ctx.arc(
    -25,
    -36,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    25,
    -36,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;


  ctx.restore();
}


/* =========================
   COIN
========================= */

function coin(o){

  const z=o.z;

  const x=laneX(o.lane,z);
  const y=perspective(z)-35*z;

  const s=.35+1.7*z;

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s,s);

  const spin=
    Math.abs(
      Math.cos(
        game.distance*.05+
        o.seed
      )
    );

  ctx.scale(
    Math.max(.25,spin),
    1
  );

  ctx.beginPath();

  ctx.arc(
    0,0,
    11,
    0,
    Math.PI*2
  );

  ctx.fillStyle="#ffd83c";

  ctx.shadowBlur=20;
  ctx.shadowColor="#ffd83c";

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff2a1";
  ctx.lineWidth=2;

  ctx.stroke();

  ctx.restore();
}


/* =========================
   GEM
========================= */

function gem(o){

  const z=o.z;

  const x=laneX(o.lane,z);
  const y=perspective(z)-35*z;

  const s=.3+1.6*z;

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s,s);
  ctx.rotate(Math.PI/4);

  ctx.fillStyle="#43eaff";

  ctx.shadowBlur=23;
  ctx.shadowColor="#42eaff";

  ctx.fillRect(
    -10,-10,
    20,20
  );

  ctx.shadowBlur=0;

  ctx.restore();
}


/* =========================
   BARRIER
========================= */

function barrier(o){

  const z=o.z;

  const x=laneX(o.lane,z);
  const y=perspective(z);

  const s=.3+1.55*z;

  ctx.save();

  ctx.translate(x,y);
  ctx.scale(s,s);

  ctx.fillStyle="rgba(0,0,0,.35)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    6,
    31,
    9,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  const g=
    ctx.createLinearGradient(
      0,-40,
      0,0
    );

  g.addColorStop(0,"#ff656b");
  g.addColorStop(1,"#9c1e35");

  ctx.fillStyle=g;

  ctx.fillRect(
    -30,
    -40,
    60,
    40
  );


  ctx.strokeStyle="#ffb5a8";
  ctx.lineWidth=3;

  ctx.strokeRect(
    -30,
    -40,
    60,
    40
  );


  ctx.fillStyle="#fff";

  for(let i=-28;i<30;i+=18){

    ctx.save();

    ctx.translate(i,-38);
    ctx.rotate(-.55);

    ctx.fillRect(
      -4,
      0,
      8,
      31
    );

    ctx.restore();
  }

  ctx.restore();
}


/* =========================
   PLAYER
========================= */

function drawPlayer(){

  const x=
    W/2+
    (game.lane-1)*W*.105;

  const base=
    H*.82;

  const y=
    base-
    player.jump;

  player.run+=.17;

  const swing=
    Math.sin(player.run)*8;

  const bob=
    Math.abs(
      Math.sin(player.run)
    )*2;

  ctx.save();

  ctx.translate(
    x,
