<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rail Rush Adventure</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#101827}
body{display:flex;justify-content:center;align-items:center}
#game{position:relative;width:min(100vw,900px);height:min(100vh,700px);overflow:hidden;background:#87ceeb;border-radius:18px}
canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:5}
.box{background:rgba(0,0,0,.45);color:#fff;padding:8px 12px;border-radius:12px;font-weight:bold}
button{cursor:pointer}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10}
.panel{width:min(90%,430px);padding:28px;text-align:center;background:#fff;border-radius:22px;box-shadow:0 15px 40px rgba(0,0,0,.25)}
.panel h1{color:#163b67}
.main{border:0;border-radius:14px;padding:14px 26px;font-size:20px;font-weight:bold;background:#1e88e5;color:white}
.hidden{display:none}
.controls{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:6}
.ctrl{width:62px;height:62px;border:0;border-radius:18px;background:rgba(0,0,0,.45);color:#fff;font-size:28px}
#area{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:5;color:#fff;background:rgba(0,0,0,.4);padding:7px 14px;border-radius:20px;opacity:0;transition:.3s}
#flash{position:absolute;inset:0;background:red;opacity:0;z-index:8;pointer-events:none}
</style>
</head>

<body>
<div id="game">
<canvas id="canvas" width="900" height="700"></canvas>

<div class="hud">
  <div class="box">⭐ <span id="score">0</span></div>
  <div class="box">🪙 <span id="coins">0</span></div>
  <div class="box">💎 <span id="gems">0</span></div>
  <div class="box">❤️ <span id="life">3</span></div>
  <button class="box" id="pause">Ⅱ</button>
</div>

<div id="area">🌆 KOTA</div>
<div id="flash"></div>

<div id="start" class="center">
  <div class="panel">
    <h1>🚆 Rail Rush Adventure</h1>
    <p>Hindari penghalang, kumpulkan koin dan permata!</p>
    <button class="main" id="startBtn">MULAI GAME</button>
    <p>⬅️ ➡️ berpindah jalur<br>⬆️ melompat</p>
  </div>
</div>

<div id="over" class="center hidden">
  <div class="panel">
    <h1>💥 GAME OVER</h1>
    <p>Skor: <b id="finalScore">0</b></p>
    <p>Terbaik: <b id="best">0</b></p>
    <button class="main" id="again">MAIN LAGI</button>
  </div>
</div>

<div class="controls">
  <button class="ctrl" id="leftBtn">⬅️</button>
  <button class="ctrl" id="jumpBtn">⬆️</button>
  <button class="ctrl" id="rightBtn">➡️</button>
</div>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const W=900,H=700;

const game={
  running:false,
  paused:false,
  score:0,
  coins:0,
  gems:0,
  life:3,
  lane:1,
  speed:0.0075,
  distance:0,
  spawnTimer:8000,
  best:Number(localStorage.getItem("railBest")||0)
};

const player={jump:0,velocity:0,hit:0};
let objects=[];
let last=performance.now();

function laneX(lane,z=0){
  return W/2+(lane-1)*(125+z*85);
}

function roadY(z){
  return 350+z*260;
}

function scale(z){
  return .35+z*.95;
}

function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#63b8ff");
  g.addColorStop(.55,"#bde9ff");
  g.addColorStop(1,"#f5d6a1");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle="#7ca56c";
  ctx.beginPath();
  ctx.moveTo(0,330);
  ctx.lineTo(120,220);
  ctx.lineTo(220,315);
  ctx.lineTo(340,190);
  ctx.lineTo(470,320);
  ctx.lineTo(600,210);
  ctx.lineTo(760,325);
  ctx.lineTo(900,200);
  ctx.lineTo(900,380);
  ctx.lineTo(0,380);
  ctx.closePath();
  ctx.fill();
}

function drawRoad(){
  ctx.fillStyle="#505050";
  ctx.beginPath();
  ctx.moveTo(0,700);
  ctx.lineTo(900,700);
  ctx.lineTo(620,340);
  ctx.lineTo(280,340);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle="#ddd";
  ctx.lineWidth=7;

  for(let lane=0;lane<3;lane++){
    ctx.beginPath();
    ctx.moveTo(laneX(lane,1),700);
    ctx.lineTo(laneX(lane,0),340);
    ctx.stroke();
  }

  for(let i=0;i<16;i++){
    const z=i/16;
    ctx.fillStyle="#795548";
    ctx.fillRect(
      laneX(0,z)-30,
      roadY(z),
      170+z*250,
      6
    );
  }
}

function drawScenery(){
  const area=Math.floor(game.distance/1800)%3;

  if(area===0){
    for(let i=0;i<7;i++){
      const x=i*145;
      const h=60+(i%3)*25;
      ctx.fillStyle="#78909c";
      ctx.fillRect(x,330-h,70,h);
      ctx.fillStyle="#ffe082";
      ctx.fillRect(x+12,315-h,12,12);
      ctx.fillRect(x+40,315-h,12,12);
    }
  }

  if(area===1){
    ctx.fillStyle="#4e342e";
    ctx.beginPath();
    ctx.arc(450,420,350,Math.PI,0);
    ctx.fill();
  }

  if(area===2){
    for(let i=0;i<8;i++){
      const x=i*125+40;
      ctx.fillStyle="#2e7d32";
      ctx.beginPath();
      ctx.arc(x,310,35,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle="#795548";
      ctx.fillRect(x-5,310,10,55);
    }
  }
}

function addObject(type,lane,z){
  objects.push({type,lane,z,spin:0});
}

function resetObjects(){
  objects=[];
  addObject("coin",0,1.3);
  addObject("coin",1,1.7);
  addObject("gem",2,2.1);
  addObject("barrier",1,2.8);
}

function spawnWave(){
  const lane=Math.floor(Math.random()*3);
  const r=Math.random();

  if(r<.55) addObject("coin",lane,2.2);
  else if(r<.75) addObject("gem",lane,2.2);
  else addObject("barrier",lane,2.2);
}

function drawCoin(o){
  const x=laneX(o.lane,o.z);
  const y=roadY(o.z)-60*scale(o.z);
  const r=16*scale(o.z);

  ctx.fillStyle="#ffd54f";
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#fff3a0";
  ctx.fillRect(x-3*scale(o.z),y-9*scale(o.z),6*scale(o.z),18*scale(o.z));
}

function drawGem(o){
  const x=laneX(o.lane,o.z);
  const y=roadY(o.z)-70*scale(o.z);
  const s=18*scale(o.z);

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(Math.PI/4);
  ctx.fillStyle="#63f3ff";
  ctx.fillRect(-s/2,-s/2,s,s);
  ctx.restore();
}

function drawBarrier(o){
  const x=laneX(o.lane,o.z);
  const y=roadY(o.z)-25*scale(o.z);
  const w=50*scale(o.z);
  const h=45*scale(o.z);

  ctx.fillStyle="#d84315";
  ctx.fillRect(x-w/2,y-h,w,h);

  ctx.fillStyle="#fff";
  ctx.fillRect(x-w/2,y-h*.65,w,7);
  ctx.fillRect(x-w/2,y-h*.25,w,7);
}

function drawPlayer(){
  const x=laneX(game.lane);
  const y=roadY(0)-28-player.jump;

  if(player.hit>0 && Math.floor(player.hit*10)%2===0)return;

  ctx.fillStyle="#1565c0";
  ctx.fillRect(x-18,y-55,36,35);

  ctx.fillStyle="#ffcc80";
  ctx.beginPath();
  ctx.arc(x,y-68,16,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#263238";
  ctx.fillRect(x-13,y-83,26,8);

  ctx.fillStyle="#212121";
  ctx.fillRect(x-14,y-20,10,25);
  ctx.fillRect(x+4,y-20,10,25);
}

function collect(type){
  if(type==="coin"){
    game.coins++;
    game.score+=20;
  }else{
    game.gems++;
    game.score+=50;
  }
}

function hitBarrier(){
  if(player.hit>0)return;

  player.hit=.8;
  game.life--;
  game.score=Math.max(0,game.score-30);

  document.getElementById("flash").style.opacity=.5;

  setTimeout(()=>{
    document.getElementById("flash").style.opacity=0;
  },120);

  if(game.life<=0)endGame();
}

function updateObjects(dt){
  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i];

    /* SANGAT PELAN */
    o.z-=game.speed*(dt/1000);

    if(o.z<0.18 && o.lane===game.lane){

      if(o.type==="barrier"){
        if(player.jump<55)hitBarrier();
        objects.splice(i,1);
        continue;
      }

      if(player.jump<120){
        collect(o.type);
        objects.splice(i,1);
        continue;
      }
    }

    if(o.z<-0.2)objects.splice(i,1);
  }
}

function updatePlayer(dt){
  if(player.jump>0 || player.velocity>0){
    player.velocity-=.0019*dt;
    player.jump+=player.velocity*dt/16;

    if(player.jump<=0){
      player.jump=0;
      player.velocity=0;
    }
  }

  if(player.hit>0){
    player.hit=Math.max(0,player.hit-dt/1000);
  }
}

function update(dt){
  if(!game.running||game.paused)return;

  game.distance+=game.speed*(dt/1000)*100;

  game.score+=dt*.01;

  /* Kecepatan naik sangat perlahan */
  game.speed=Math.min(
    0.013,
    0.0075+game.distance*0.0000008
  );

  game.spawnTimer-=dt;

  if(game.spawnTimer<=0){
    spawnWave();
    game.spawnTimer=7000;
  }

  updatePlayer(dt);
  updateObjects(dt);
  updateHUD();
}

function updateHUD(){
  document.getElementById("score").textContent=Math.floor(game.score);
  document.getElementById("coins").textContent=game.coins;
  document.getElementById("gems").textContent=game.gems;
  document.getElementById("life").textContent=game.life;
}

function startGame(){
  game.running=true;
  game.paused=false;
  game.score=0;
  game.coins=0;
  game.gems=0;
  game.life=3;
  game.lane=1;
  game.speed=.0075;
  game.distance=0;
  game.spawnTimer=8000;

  player.jump=0;
  player.velocity=0;
  player.hit=0;

  resetObjects();

  document.getElementById("start").classList.add("hidden");
  document.getElementById("over").classList.add("hidden");
}

function endGame(){
  game.running=false;
  game.paused=false;

  if(game.score>game.best){
    game.best=Math.floor(game.score);
    localStorage.setItem("railBest",game.best);
  }

  document.getElementById("finalScore").textContent=Math.floor(game.score);
  document.getElementById("best").textContent=game.best;
  document.getElementById("over").classList.remove("hidden");
}

function moveLeft(){
  if(!game.running||game.paused)return;
  game.lane=Math.max(0,game.lane-1);
}

function moveRight(){
  if(!game.running||game.paused)return;
  game.lane=Math.min(2,game.lane+1);
}

function jump(){
  if(!game.running||game.paused)return;
  if(player.jump===0)player.velocity=.95;
}

function togglePause(){
  if(!game.running)return;
  game.paused=!game.paused;
  document.getElementById("pause").textContent=game.paused?"▶":"Ⅱ";
}

document.getElementById("startBtn").onclick=startGame;
document.getElementById("again").onclick=startGame;
document.getElementById("leftBtn").onclick=moveLeft;
document.getElementById("rightBtn").onclick=moveRight;
document.getElementById("jumpBtn").onclick=jump;
document.getElementById("pause").onclick=togglePause;

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")moveLeft();
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")moveRight();

  if(e.key==="ArrowUp"||e.key===" "||e.key.toLowerCase()==="w"){
    e.preventDefault();
    jump();
  }

  if(e.key.toLowerCase()==="p")togglePause();
});

let touchX=0,touchY=0;

canvas.addEventListener("touchstart",e=>{
  const t=e.changedTouches[0];
  touchX=t.clientX;
  touchY=t.clientY;
},{passive:true});

canvas.addEventListener("touchend",e=>{
  const t=e.changedTouches[0];
  const dx=t.clientX-touchX;
  const dy=t.clientY-touchY;

  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>30)moveRight();
    if(dx<-30)moveLeft();
  }else if(dy<-30){
    jump();
  }
},{passive:true});

function draw(){
  drawBackground();
  drawScenery();
  drawRoad();

  const sorted=[...objects].sort((a,b)=>b.z-a.z);

  for(const o of sorted){
    if(o.type==="coin")drawCoin(o);
    if(o.type==="gem")drawGem(o);
    if(o.type==="barrier")drawBarrier(o);
  }

  if(game.running)drawPlayer();
}

function loop(now){
  const dt=Math.min(now-last,40);
  last=now;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

document.getElementById("best").textContent=game.best;
requestAnimationFrame(loop);
</script>
</body>
</html>
